[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "online-ml-and-drift-monitoring"
version = "0.1.0"
description = "Online ML inference and drift monitoring system"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Core
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "joblib>=1.3",

    # ML
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "xgboost>=2.0",

    # API
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",

    # Utils
    "pyyaml>=6.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]